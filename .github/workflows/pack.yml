name: CI

on:
  push:
    branches: [ "light-mode" ]
  pull_request:
    branches: [ "light-mode" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine next beta number
        id: beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LAST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            | awk -F'\t' '{print $1}' \
            | grep -Eo '^beta [0-9]+$' \
            | grep -Eo '[0-9]+' \
            | sort -n \
            | tail -1)
          if [ -z "$LAST" ]; then
            NEXT=1
          else
            NEXT=$((LAST + 1))
          fi
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next beta number: $NEXT"

      - name: Build .mcpack
        run: |
          mkdir -p /tmp/out
          zip -r "/tmp/out/package.zip" . -x ".git/*" -x ".github/*"
          mv "/tmp/out/package.zip" "/tmp/out/java_containers_preview.v${{ steps.beta.outputs.next }}.mcpack"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "beta${{ steps.beta.outputs.next }}" \
            "/tmp/out/beta${{ steps.beta.outputs.next }}.mcpack" \
            --repo "$GITHUB_REPOSITORY" \
            --title "beta ${{ steps.beta.outputs.next }}" \
            --notes "Automated beta build from commit ${{ github.sha }}"
